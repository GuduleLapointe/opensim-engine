openapi: 3.1.0
info:
  title: 'OpenSim engine'
  version: 89d6562
  license:
    name: AGPL-3.0-or-later
    identifier: AGPL-3.0-or-later
  description: |-
    The grids, the simulators and the services of an install, and what is in the databases of a grid, as JSON:API resources; the errors are problem details (RFC 9457).

    A list takes `search`, `sort` (`-` before a column for the descending order), `filter[<name>]`, `page[number]` and `page[size]`.

    ## Authentication

    The API is closed: what manages the machine and the grids (the resources, the tasks, the health) needs an API key, sent as `Authorization: Bearer <key>`. A key is made on the machine and shown once: `opensim api-key create <label>`; `opensim api-key list` lists them without what opens them, `opensim api-key revoke <id>` closes one. A key opens everything for now. To try the API from this documentation, open the [test page](try.html), enter the address of the API and click Authorize.

    What the viewers, the simulators and the visitors of a site call needs none (the message of the day, the guide, the pictures, the status of the grid, the pages): the operations marked as open. The calls in a format of OpenSimulator and the viewers (search, registration, offline messages, currency, land tools) are protected by what the protocol has: the secure session of an avatar, the secret of a region, the key of the money server.
servers:
  -
    url: /
    description: 'Where the application that uses the engine mounts the API'
security:
  -
    ApiKey: []
tags:
  -
    name: Grids
    description: 'A grid run from this machine, only described here (a grid joined on another machine), or a standalone (one simulator that serves it all).'
  -
    name: Simulators
    description: 'A simulator is identified by its address (host:port); its slug has its grid (`vonda.welcome`).'
  -
    name: Services
    description: |-
      What the simulators and the users of a grid ask for: the assets, the profiles, the login, the search. A service is served by a Robust of the grid, by the simulator of a standalone, or by a web site (the helpers) at an address the config of the grid gives.

      `get-grid-info` is the /get_grid_info that Robust answers: the engine reads it, it does not provide one.

      `kind` says who fixes the format of a web service: `fixed` (OpenSimulator or the viewers: only the address is the grid's to choose, and the format is described in this contract as an endpoint of its own) or `standard` (the engine's own; `standard` is its address, `legacy` the script that answered it before). `endpoint` is where the engine serves it.
  -
    name: Archives
    description: 'The inventories (`iar`) and the regions (`oar`) the consoles of the simulators saved, in the data folder of their grid, and the backups of the setup (`backup`: the configuration, the data and the databases of a grid or of a simulator, `.tar.gz`). A file says what is in it by its name; they are read here, made by `opensim save iar|oar` and `opensim backup`.'
  -
    name: Avatars
    description: 'Read from the databases of the grid, each in the one of its service. An avatar is made with its account, its password, its inventory and its default outfit. Its name does not change.'
  -
    name: Regions
    description: 'The regions the grid knows (its table of regions) and the ones its simulators describe.'
  -
    name: Parcels
    description: 'The land of every simulator of the grid, read in the database of each.'
  -
    name: Estates
    description: 'The estates of the grid when its Robust serves them, else the ones of each simulator.'
  -
    name: Assets
    description: 'What the grid keeps in its asset service: textures, sounds, notecards, scripts, objects... A record never carries its data: an image of any type (texture, TGA, JPEG) is asked as a picture (`/grids/{grid}/assets/{id}.{format}`, the grid keeps textures as JPEG 2000 and the engine converts them and keeps the result for a day), the other types as they are.'
  -
    name: Destinations
    description: 'The places the guide of the grid shows, by category, in the order of its source (`GuideSource` of `[Helpers]`: a file or a URL of "Name|Region URL" lines). The same list feeds the page of the guide and the boards of the scripts.'
  -
    name: Tasks
    description: 'Cron and pseudo cron: each task has a name and an interval, runs when due, never twice at once, and a failure waits for its next turn. Asked to run, a task runs now. The search registers two: `search-parse` (once a minute: reads the snapshots of the registered simulators that are due) and `events-parse` (every 55 minutes: reads the calendar of events).'
  -
    name: Forms
    description: 'The fields of the forms (grid, remote-grid, simulator, region), in the standard format of the forms: name, label, type, default, options, condition, follows, group. Whoever shows a form (the terminal, a web page) reads them from here; the engine itself uses them to work out what is not answered.'
  -
    name: Fonts
    description: 'The names to give as `font` of a text image (`/text-images`).'
  -
    name: Search
    description: "The search of the grid, made by the helpers: the simulators register to it and tell it their regions (a snapshot the helpers read), the viewers ask it for places, popular places, land for sale, events and classifieds. The format is the one of the module OpenSimSearch of the simulators; the address is the grid's to choose (`SearchURL` of `[Search]` and `DATA_SRV_*` of `[DataSnapshot]` in OpenSim.ini). A search can be shared by several grids: `gk`, the gatekeeper of the grid that asks, tells for which the search is made (the viewers do not send it). These calls need no API key: the viewers and the simulators do not send one."
  -
    name: Economy
    description: 'The currency and the land tools of the grid, as the viewers and the money modules call them: XML-RPC at `currency.php` and `landtool.php` under the economy address the grid gives its viewers (`economy` of `[GridInfoService]`). Nothing is served without the key of the grid (`MoneyScriptAccessKey` of `[MoneyServer]`): a quote is tied to its purchase with it and to the address of who asked. An avatar proves who they are with their secure session, a region with its secret: no API key is needed, the viewers do not send one.'
  -
    name: 'Offline messages'
    description: 'The messages for the avatars who are not there, with the module V1 of the simulators (`OfflineMessageModule = OfflineMessageModule`, `OfflineMessageURL` of `[Messaging]`), which posts them here in XML. The messages are kept in the table of the offline messages of Robust, the one its module V2 uses; an avatar who asked for it in their viewer also gets them by email. The other choice is the module V2 and the service of Robust, which needs none of this: with the helpers, the messages are mailed on request and none is lost; with Robust, nothing more is run, no mail is sent and 25 messages are kept per avatar.'
  -
    name: Health
    description: 'Whether the grid and its web services answer as they should.'
  -
    name: Addresses
    description: 'Where the services of the grid are, and what the grid says of itself. The engine reads them from the files of the grid and from its `get_grid_info`, and gives them to the helpers, the manager and the plugins, which do not read the config again.'
  -
    name: Monitor
    description: 'The state of the grid at a glance: its Robust, its simulators (on this machine and elsewhere), its regions, who is in world. As data, as the lines of `opensim status`, or as a picture for a prim. The diagnosis, address by address, is the health.'
  -
    name: 'Message of the day'
    description: 'The text the viewers show at login.'
  -
    name: 'Text images'
    description: 'Pictures of a text, for the signs and the boards in world.'
  -
    name: Pages
    description: 'The pages the helpers show to the people, in HTML, at the addresses the grid gives (`GridInfoService` and `LoginService` in Robust.ini). They are made from the resources of this API: the guide shows `/grids/{grid}/destinations`, the profile an avatar.'
  -
    name: 'Grid info'
    description: 'What Robust itself serves, which the engine reads.'
  -
    name: Setup
    description: 'The rules of the setup, for the tools that make a grid: from a few answers, the whole setup they stand for and what is wrong with them. Nothing is written, the tool shows the setup, asks again what is wrong and applies it.'
  -
    name: System
    description: 'The resolved OpenSim system layout and its Unix identities.'
x-tagGroups:
  -
    name: Machine
    tags:
      - Grids
      - Simulators
      - Services
      - Archives
  -
    name: Grid
    tags:
      - Avatars
      - Regions
      - Parcels
      - Estates
      - Assets
      - Destinations
      - Addresses
      - 'Message of the day'
      - Search
      - Economy
      - 'Offline messages'
      - Health
      - Monitor
  -
    name: Application
    tags:
      - Tasks
      - Forms
      - Fonts
      - 'Text images'
      - Setup
  -
    name: 'Helpers pages'
    tags:
      - Pages
  -
    name: Robust
    tags:
      - 'Grid info'
paths:
  /grids:
    get:
      operationId: listGrids
      tags:
        - Grids
      summary: 'List grids'
      description: 'The grids of this machine, searched, filtered, sorted and paged.'
      parameters:
        -
          name: search
          in: query
          schema:
            type: string
        -
          name: sort
          in: query
          description: 'A column, `-` before it for the descending order'
          schema:
            type: string
        -
          name: 'page[number]'
          in: query
          schema:
            type: integer
            minimum: 1
        -
          name: 'page[size]'
          in: query
          schema:
            type: integer
            minimum: 0
        -
          name: 'filter[remote]'
          in: query
          schema:
            type: string
            enum:
              - 'yes'
              - 'no'
        -
          name: 'filter[enabled]'
          in: query
          schema:
            type: string
            enum:
              - 'yes'
              - 'no'
        -
          name: 'filter[hypergrid]'
          in: query
          schema:
            type: string
            enum:
              - 'yes'
              - 'no'
      responses:
        200:
          description: 'A page of the grids'
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Grids'
                  meta:
                    type: object
        404:
          description: 'The grid is not known here'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        503:
          description: 'What the list is read from is not available'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  '/grids/{id}':
    get:
      operationId: getGrid
      tags:
        - Grids
      summary: 'Get grid'
      description: 'One of the grids by its id.'
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: 'The resource'
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Grids'
        404:
          description: 'There is none with this id'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    patch:
      operationId: updateGrid
      tags:
        - Grids
      summary: 'Change grid'
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              type: object
              properties:
                data:
                  type: object
                  properties:
                    attributes:
                      type: object
                      properties: { enabled: { type: boolean, description: 'Enable or disable the grid (its Robust); a running grid is not stopped' } }
      responses:
        200:
          description: Changed
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Grids'
        400:
          description: 'A value is wrong'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        404:
          description: 'There is none with this id'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        503:
          description: 'No channel can change it now'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /simulators:
    get:
      operationId: listSimulators
      tags:
        - Simulators
      summary: 'List simulators'
      description: 'The simulators of this machine, searched, filtered, sorted and paged.'
      parameters:
        -
