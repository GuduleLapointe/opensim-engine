  '/grids/{grid}/landtool.php':
    post:
      operationId: landTool
      tags:
        - Economy
      summary: 'Land tools'
      description: |
        The purchase of land: what it costs and the currency it needs. XML-RPC at `landtool.php` of the economy address of the grid. The land itself is paid afterwards, by the region.

        ### `preflightBuyLandPrep`

        The viewer asks what buying land would cost, before it does.

        **Request** (the struct)

        | Field | Type | |
        | --- | --- | --- |
        | `agentId` | string | The avatar |
        | `secureSessionId` | string | Its secure session |
        | `currencyBuy` | integer | The currency it lacks |
        | `billableArea` | integer | The area of the land |

        **Answer**

        | Field | Type | |
        | --- | --- | --- |
        | `success` | boolean | Whether the avatar proved who they are |
        | `currency` | object | `estimatedCost` |
        | `membership` | object | No upgrade: `upgrade` false, `action` the page of the helpers, `levels` |
        | `landUse` | object | `upgrade` false, `action` the page of the helpers |
        | `confirm` | string | What ties the quote to the purchase |

        ### `buyLandPrep`

        The viewer buys the currency it lacks for the land; the land itself is paid afterwards, by the region (`regionMoveMoney`).

        **Request** (the struct)

        | Field | Type | |
        | --- | --- | --- |
        | `agentId` | string | The avatar |
        | `secureSessionId` | string | Its secure session |
        | `currencyBuy` | integer | The currency it buys |
        | `estimatedCost` | integer | What the quote said |
        | `billableArea` | integer | The area of the land |
        | `confirm` | string | The value the quote gave |

        **Answer**

        | Field | Type | |
        | --- | --- | --- |
        | `success` | boolean | Whether the currency was added |
        | `errorMessage` | string | Why not |
        | `errorURI` | string | The page of the helpers |
      parameters:
        -
          name: grid
          in: path
          required: true
          description: 'The nick of the grid'
          schema:
            type: string
      requestBody:
        required: true
        content:
          text/xml:
            schema:
              type: string
              description: 'XML-RPC method call'
            examples:
              preflightBuyLandPrep:
                summary: preflightBuyLandPrep
                value: |-
                  <?xml version="1.0"?>
                  <methodCall>
                  <methodName>preflightBuyLandPrep</methodName>
                  <params>
                  <param>
                  <value><struct>
                  <member><name>agentId</name>
                  <value><string>aaaaaaaa-1111-4111-8111-aaaaaaaaaaaa</string></value>
                  </member>
                  <member><name>secureSessionId</name>
                  <value><string>eeeeeeee-5555-4555-8555-eeeeeeeeeeee</string></value>
                  </member>
                  <member><name>currencyBuy</name>
                  <value><int>500</int></value>
                  </member>
                  <member><name>billableArea</name>
                  <value><int>256</int></value>
                  </member>
                  </struct></value>
                  </param>
                  </params>
                  </methodCall>
              buyLandPrep:
                summary: buyLandPrep
                value: |-
                  <?xml version="1.0"?>
                  <methodCall>
                  <methodName>buyLandPrep</methodName>
                  <params>
                  <param>
                  <value><struct>
                  <member><name>agentId</name>
                  <value><string>aaaaaaaa-1111-4111-8111-aaaaaaaaaaaa</string></value>
                  </member>
                  <member><name>secureSessionId</name>
                  <value><string>eeeeeeee-5555-4555-8555-eeeeeeeeeeee</string></value>
                  </member>
                  <member><name>currencyBuy</name>
                  <value><int>500</int></value>
                  </member>
                  <member><name>estimatedCost</name>
                  <value><int>200</int></value>
                  </member>
                  <member><name>billableArea</name>
                  <value><int>256</int></value>
                  </member>
                  <member><name>confirm</name>
                  <value><string>5ebe2294ecd0e0f08eab7690d2a6ee69</string></value>
                  </member>
                  </struct></value>
                  </param>
                  </params>
                  </methodCall>
      responses:
        200:
          description: 'The answer of the method'
          content:
            text/xml:
              schema:
                type: string
              examples:
                preflightBuyLandPrep:
                  summary: preflightBuyLandPrep
                  value: |
                    <?xml version="1.0" encoding="utf-8" ?>
                    <params>
                    <param>
                    <value><struct>
                    <member><name>success</name>
                    <value><boolean>1</boolean></value>
                    </member>
                    <member><name>currency</name>
                    <value><array>
                    <data>
                    </data>
                    </array></value>
                    </member>
                    <member><name>membership</name>
                    <value><array>
                    <data>
                    </data>
                    </array></value>
                    </member>
                    <member><name>landUse</name>
                    <value><array>
                    <data>
                    </data>
                    </array></value>
                    </member>
                    <member><name>confirm</name>
                    <value><string>5ebe2294ecd0e0f08eab7690d2a6ee69</string></value>
                    </member>
                    </struct></value>
                    </param>
                    </params>
                buyLandPrep:
                  summary: buyLandPrep
                  value: |
                    <?xml version="1.0" encoding="utf-8" ?>
                    <params>
                    <param>
                    <value><struct>
                    <member><name>success</name>
                    <value><boolean>1</boolean></value>
