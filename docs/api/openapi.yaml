      operationId: listAvatars
      tags:
        - Avatars
      summary: 'List avatars'
      description: 'The avatars of a grid, searched, filtered, sorted and paged.'
      parameters:
        -
          name: grid
          in: path
          required: true
          description: 'The nick of the grid'
          schema:
            type: string
        -
          name: search
          in: query
          schema:
            type: string
        -
          name: sort
          in: query
          description: 'A column, `-` before it for the descending order'
          schema:
            type: string
        -
          name: 'page[number]'
          in: query
          schema:
            type: integer
            minimum: 1
        -
          name: 'page[size]'
          in: query
