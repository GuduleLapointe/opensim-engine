                    $ref: '#/components/schemas/Simulators'
        404:
          description: 'There is none with this id'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    patch:
      operationId: updateSimulator
      tags:
        - Simulators
      summary: 'Change simulator'
      parameters:
        -
          name: id
          in: path
          required: true
