  '/grids/{grid}/currency.php':
    post:
      operationId: currency
      tags:
        - Economy
      summary: Currency
      description: |
        Quotes, purchases, balances and transfers. XML-RPC at `currency.php` of the economy address of the grid. The viewer asks the quote and buys; the simulators ask the balance of the avatars who are on them, move the money of a purchase, and claim the avatars that arrive. The answer is a struct with `success`, and the reason (`errorMessage`, `errorURI`) when it is false.

        ### `getCurrencyQuote`

        The viewer asks what an amount of currency costs.

        **Request** (the struct)

        | Field | Type | |
        | --- | --- | --- |
        | `agentId` | string | The avatar |
        | `secureSessionId` | string | Its secure session |
        | `currencyBuy` | integer | The amount |

        **Answer**

        | Field | Type | |
        | --- | --- | --- |
        | `success` | boolean | Whether the avatar proved who they are |
        | `currency` | object | `estimatedCost` (in cents) and `currencyBuy` (the amount, rounded to the pack of the module when it has some) |
        | `confirm` | string | What ties this quote to the purchase: the key of the grid and the address of whoever asked |
        | `errorMessage` | string | Why not, when it failed |
        | `errorURI` | string | The page of the helpers the viewer opens |

        ### `buyCurrency`

        The viewer buys currency.

        **Request** (the struct)

        | Field | Type | |
        | --- | --- | --- |
        | `agentId` | string | The avatar |
        | `secureSessionId` | string | Its secure session |
        | `currencyBuy` | integer | The amount |
        | `confirm` | string | The value the quote gave |

        **Answer**

        | Field | Type | |
        | --- | --- | --- |
        | `success` | boolean | Whether the currency was added; when it was not, the module of the currency of the grid says what to do (Gloebit: finish on its site, Podex: use its terminals) |
        | `errorMessage` | string | Why not |
        | `errorURI` | string | What the viewer opens |

        ### `simulatorUserBalanceRequest`

        A simulator asks the balance of an avatar who is on it.

        **Request** (the struct)

        | Field | Type | |
        | --- | --- | --- |
        | `agentId` | string | The avatar |
        | `secureSessionId` | string | Its secure session: the funds are for the one who holds it |

        **Answer**

        | Field | Type | |
        | --- | --- | --- |
        | `success` | boolean | Whether the avatar could be authenticated |
        | `agentId` | string | The avatar |
        | `funds` | integer | Its balance |

        ### `regionMoveMoney`

        A region moves money from an avatar to another (a purchase, a gift, a fee).

        **Request** (the struct)

        | Field | Type | |
        | --- | --- | --- |
        | `agentId` | string | Who pays |
        | `destId` | string | Who is paid |
        | `secureSessionId` | string | The secure session of the payer |
        | `regionId` | string | The region that asks |
        | `secret` | string | The secret of the region, which the grid gave it |
        | `cash` | integer | The amount |
        | `transactionType` | integer | The kind of transaction (5001 gift, 5002 object sale...) |
        | `flags` | integer | Its flags |
        | `description` | string | What it is for |
        | `aggregatePermInventory` | integer | Permissions of what is sold |
        | `aggregatePermNextOwner` | integer | Permissions of what is sold |

        **Answer**

        | Field | Type | |
        | --- | --- | --- |
        | `success` | boolean | Whether the money moved |
        | `agentId` | string | The payer |
        | `funds` | integer | The balance of the payer before |
        | `funds2` | integer | The same |
        | `currencySecret` | string | A space: nothing |

        ### `simulatorClaimUserRequest`

        A region claims an avatar: it is the one they are on now.

        **Request** (the struct)

        | Field | Type | |
        | --- | --- | --- |
        | `agentId` | string | The avatar |
        | `secureSessionId` | string | Its secure session |
        | `regionId` | string | The region |
        | `secret` | string | The secret of the region |

        **Answer**

        | Field | Type | |
        | --- | --- | --- |
        | `success` | boolean | Whether the region is now the one of the avatar |
        | `agentId` | string | The avatar |
        | `funds` | integer | Its balance |
        | `currencySecret` | string | A space: nothing |
      parameters:
        -
          name: grid
          in: path
          required: true
          description: 'The nick of the grid'
          schema:
