                  data:
                    $ref: '#/components/schemas/Tasks'
        404:
          description: 'There is none with this id'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /forms:
    get:
      operationId: listForms
      tags:
        - 'The application: forms'
      summary: 'What a setup asks'
      responses:
        200:
          description: 'The forms'
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Forms'
                  meta:
                    type: object
        404:
          description: 'The application has none'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  '/forms/{id}':
    get:
      operationId: getForm
      tags:
        - 'The application: forms'
      summary: 'One of the forms by its id'
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: 'The resource'
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Forms'
        404:
          description: 'There is none with this id'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  '/tasks/{id}/runs':
    post:
      operationId: runTask
      tags:
        - 'The application: tasks'
      summary: 'Run a task now, whether it is due or not'
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: 'The task ran'
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      status: { type: string }
                      message: { type: string }
                      duration: { type: number }
        404:
          description: 'There is no task with this name'
          content:
            application/problem+json:
