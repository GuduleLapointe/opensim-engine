  '/grids/{grid}/destinations':
    get:
      operationId: listDestinations
      tags:
        - Destinations
      summary: 'List destinations'
      description: 'The list of the guide. `GuideSource` of `[Helpers]` (a file or an address of "Name|Region URL" lines, a name alone starting a category) is the list; a grid that gives none has the places its search knows, ten popular places and ten places shown in search, in two sections. With `format=list` (or `Accept: text/plain`) it is the lines themselves, as the boards of the scripts read them.'
      parameters:
        -
          name: grid
          in: path
          required: true
          description: 'The nick of the grid'
          schema:
            type: string
        -
          name: format
          in: query
          required: false
          description: '`list` gives the lines the boards of the scripts read, in plain text'
          schema:
            type: string
            enum:
              - list
      responses:
        200:
          description: 'The destinations'
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Destinations'
                  meta:
                    type: object
            text/plain:
              schema:
                type: string
              examples:
                list:
                  value: |
                    Popular places
                    Rose garden|grid.example.org:8002/Welcome/128/128/25
                    Places in the search
                    Library|grid.example.org:8002/Welcome/64/64/22
        404:
          description: 'The application has none, or the grid is not known here'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security: []
