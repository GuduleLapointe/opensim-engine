            type: integer
            minimum: 0
      responses:
        200:
          description: 'A page of the simulators'
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Simulators'
                  meta:
                    type: object
        404:
          description: 'The grid is not known here'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        503:
          description: 'What the list is read from is not available'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  '/simulators/{id}':
