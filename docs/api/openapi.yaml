          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Services'
        404:
          description: 'There is none with this id'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  '/grids/{grid}/avatars':
    get:
      operationId: listAvatars
      tags:
        - 'A grid: avatars'
      summary: 'The avatars of a grid, searched, filtered, sorted and paged'
      parameters:
        -
          name: grid
          in: path
          required: true
          description: 'The nick of the grid'
          schema:
            type: string
        -
          name: search
          in: query
          schema:
            type: string
        -
          name: sort
          in: query
          description: 'A column, `-` before it for the descending order'
          schema:
            type: string
        -
          name: 'page[number]'
          in: query
          schema:
            type: integer
            minimum: 1
        -
          name: 'page[size]'
          in: query
          schema:
            type: integer
            minimum: 0
        -
          name: 'filter[active]'
          in: query
          schema:
            type: string
            enum:
              - 'yes'
              - 'no'
        -
          name: 'filter[online]'
          in: query
          schema:
            type: string
            enum:
              - 'yes'
              - 'no'
        -
          name: 'filter[god]'
          in: query
          schema:
            type: string
            enum:
              - 'yes'
              - 'no'
        -
          name: 'filter[technical]'
          in: query
          schema:
            type: string
            enum:
              - 'yes'
              - 'no'
      responses:
        200:
          description: 'A page of the avatars'
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Avatars'
                  meta:
                    type: object
        404:
          description: 'The grid is not known here'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        503:
          description: 'What the list is read from is not available'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    post:
      operationId: createAvatar
      tags:
        - 'A grid: avatars'
      summary: 'Make one'
      parameters:
        -
          name: grid
          in: path
          required: true
          description: 'The nick of the grid'
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              type: object
              properties:
                data:
                  type: object
                  properties:
                    attributes:
                      type: object
                      properties: { name: { type: string, description: 'First Last (or firstName and lastName)' }, email: { type: string }, password: { type: string, description: 'The password (or passwordHash)' }, passwordHash: { type: object, description: 'hash and salt of a password that is moved' }, uuid: { type: string, description: 'The UUID of an account that is moved' }, home: { type: string, description: 'The UUID of the home region' } }
      responses:
        201:
          description: 'Made; its address is in the Location header'
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Avatars'
        400:
          description: 'A value is wrong: a name that is not one, one that is taken, no password'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        503:
          description: 'A database cannot be reached'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  '/grids/{grid}/avatars/{id}':
    get:
      operationId: getAvatar
      tags:
        - 'A grid: avatars'
      summary: 'One of the avatars by its id'
      parameters:
        -
          name: grid
          in: path
          required: true
          description: 'The nick of the grid'
          schema:
            type: string
        -
          name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: 'The resource'
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Avatars'
        404:
          description: 'There is none with this id'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    patch:
      operationId: updateAvatar
      tags:
        - 'A grid: avatars'
      summary: 'Change one'
      parameters:
        -
          name: grid
          in: path
          required: true
          description: 'The nick of the grid'
          schema:
            type: string
        -
          name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              type: object
              properties:
                data:
                  type: object
                  properties:
                    attributes:
                      type: object
                      properties: { email: { type: string }, title: { type: string }, level: { type: integer }, active: { type: boolean }, password: { type: string, description: 'A new password' }, home: { type: string, description: 'The UUID of the home region' }, about: { type: string, description: 'Of the profile the avatar has' }, profileUrl: { type: string }, wants: { type: string }, skills: { type: string }, languages: { type: string }, firstLife: { type: string } }
      responses:
        200:
          description: Changed
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Avatars'
        400:
          description: 'A value is wrong'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        404:
          description: 'There is none with this id'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        503:
          description: 'No channel can change it now'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    delete:
      operationId: deleteAvatar
      tags:
        - 'A grid: avatars'
      summary: 'Delete one'
      parameters:
        -
          name: grid
          in: path
          required: true
          description: 'The nick of the grid'
          schema:
            type: string
        -
          name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        204:
          description: Deleted
        404:
          description: 'There is none with this id'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        503:
          description: 'No channel can delete it now'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  '/grids/{grid}/regions':
    get:
      operationId: listRegions
      tags:
        - 'A grid: regions'
      summary: 'The regions of a grid, searched, filtered, sorted and paged'
      parameters:
        -
          name: grid
          in: path
          required: true
          description: 'The nick of the grid'
          schema:
            type: string
        -
          name: search
          in: query
          schema:
            type: string
        -
          name: sort
          in: query
          description: 'A column, `-` before it for the descending order'
          schema:
            type: string
        -
          name: 'page[number]'
          in: query
          schema:
            type: integer
            minimum: 1
