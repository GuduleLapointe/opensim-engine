        content:
          application/vnd.api+json:
            schema:
              type: object
              properties:
                data:
                  type: object
                  properties:
                    attributes:
                      type: object
                      properties: { enabled: { type: boolean, description: 'Enable or disable the simulator; a running simulator is not stopped' } }
      responses:
        200:
          description: Changed
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Simulators'
        400:
          description: 'A value is wrong'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        404:
          description: 'There is none with this id'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        503:
          description: 'No channel can change it now'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /services:
    get:
      operationId: listServices
      tags:
        - Services
      summary: 'List services'
      description: 'The services of the grids of this machine, searched, filtered, sorted and paged.'
      parameters:
        -
          name: search
          in: query
          schema:
            type: string
        -
          name: sort
          in: query
          description: 'A column, `-` before it for the descending order'
          schema:
            type: string
        -
          name: 'page[number]'
          in: query
          schema:
            type: integer
            minimum: 1
        -
          name: 'page[size]'
          in: query
          schema:
            type: integer
            minimum: 0
        -
          name: 'filter[served]'
          in: query
          schema:
            type: string
            enum:
              - 'yes'
              - 'no'
        -
          name: 'filter[port]'
          in: query
          schema:
            type: string
            enum:
              - private
              - public
              - web
      responses:
        200:
          description: 'A page of the services'
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Services'
                  meta:
                    type: object
        404:
          description: 'The grid is not known here'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        503:
          description: 'What the list is read from is not available'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  '/services/{id}':
    get:
      operationId: getService
      tags:
        - Services
      summary: 'Get service'
      description: 'One of the services by its id.'
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: 'The resource'
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Services'
        404:
          description: 'There is none with this id'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /archives:
    get:
      operationId: listArchives
      tags:
        - Archives
      summary: 'List archives'
      description: 'The archives and the backups of the grids of this machine, searched, filtered, sorted and paged.'
      parameters:
        -
          name: search
          in: query
          schema:
            type: string
        -
          name: sort
          in: query
          description: 'A column, `-` before it for the descending order'
          schema:
            type: string
        -
          name: 'page[number]'
          in: query
          schema:
            type: integer
            minimum: 1
        -
          name: 'page[size]'
          in: query
          schema:
            type: integer
            minimum: 0
        -
          name: 'filter[kind]'
          in: query
          schema:
            type: string
            enum:
              - iar
              - oar
              - backup
      responses:
