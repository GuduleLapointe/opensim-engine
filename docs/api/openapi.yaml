          name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              type: object
              properties:
                data:
                  type: object
                  properties:
                    attributes:
                      type: object
                      properties: { enabled: { type: boolean, description: 'Enable or disable the grid (its Robust); a running grid is not stopped' } }
      responses:
        200:
          description: Changed
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Grids'
        400:
