              schema:
                $ref: '#/components/schemas/Problem'
components:
  schemas:
    Problem:
      type: object
      description: 'RFC 9457 problem details'
      required:
        - title
        - status
      properties:
        type:
          type: string
          description: 'A URN that names the kind of problem'
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          description: 'The address that was asked'
    Grids:
      type: object
      description: 'The grids of this machine'
      required:
        - type
        - id
        - attributes
      properties:
        type:
          const: grids
        id:
          type: string
        attributes:
          type: object
          properties:
            nick:
              type: string
              description: 'What names its folder, its databases and its instances (snake_case)'
            name:
              type: string
              description: 'The name shown'
            slug:
              type: string
              description: 'The name made for an address (kebab-case)'
            sources:
              type: array
              description: 'Where it is known from: folder, plan, described, announced'
            directory:
              type:
                - string
                - 'null'
              description: 'Its folder'
            remote:
              type: boolean
              description: 'Its Robust is on another machine'
            standalone:
              type: boolean
              description: 'One simulator serves the grid itself, no Robust runs'
            planned:
              type: boolean
              description: 'Not made yet'
            enabled:
              type:
                - boolean
                - 'null'
              description: 'Its Robust (or its simulator, for a standalone) is enabled: null when it is not on this machine'
            hypergrid:
              type: boolean
              description: 'Open to the other grids'
            baseHostname:
              type: string
              description: 'The host its viewers log in to'
            publicPort:
              type: integer
              description: 'The port of the viewers and of the other grids'
            privatePort:
              type: integer
              description: 'The port of its simulators'
            center:
              type:
                - string
                - 'null'
              description: 'The center of its map (x,y)'
            regionSpacing:
              type: integer
              description: 'The free blocks its regions leave between them'
            preset:
              type:
                - string
                - 'null'
              description: 'The preset of the grid it joins (OSGrid...)'
            coreDirectory:
              type:
                - string
                - 'null'
              description: 'The OpenSimulator release it runs'
            robustIni:
              type:
                - string
                - 'null'
              description: 'The config of its Robust'
            connectors:
              type: array
              description: 'The services its Robust serves (the keys of [ServiceList])'
            regionFlags:
              type: array
              description: 'The roles its Robust gives to regions'
            roles:
              type: array
              description: 'The roles a region of the grid can have'
            missingRoles:
              type: array
              description: 'The roles no region has yet'
            databaseHost:
              type: string
              description: 'The host of its database'
            databaseName:
              type: string
              description: 'The name of its database'
            databaseUser:
              type: string
              description: 'The user of its database'
            webUrl:
              type:
                - string
                - 'null'
              description: 'The web site of its helpers'
            helpers:
              type: boolean
              description: 'Its helpers are installed'
            simulators:
              type:
                - array
                - 'null'
              description: 'The names of its simulators'
            announcement:
              type:
                - object
                - 'null'
              description: 'What the grid says of itself at get_grid_info'
        links:
          type: object
          properties:
            self:
              type: string
    Simulators:
      type: object
      description: 'The simulators of this machine'
      required:
        - type
        - id
        - attributes
      properties:
        type:
          const: simulators
        id:
          type: string
        attributes:
          type: object
          properties:
            uri:
              type: string
              description: 'Its address, host:port of its HTTP port: what identifies it'
            name:
              type: string
              description: 'The name shown'
            slug:
              type: string
              description: 'Its grid, an underscore, its own slug'
            grid:
              type:
                - string
                - 'null'
              description: 'The nick of its grid'
            ini:
              type: string
              description: 'Its config'
            link:
              type: string
              description: 'The link that enables it'
            enabled:
              type: boolean
              description: 'Its link is there'
            running:
              type: boolean
              description: 'Its process is running'
            httpPort:
              type: integer
              description: 'Its HTTP port, the first of its block of ten'
            consolePort:
              type: integer
              description: 'The port of its console (x4 of the block)'
            console:
              type: string
              description: 'How its console is reached: rest or screen'
            databaseHost:
              type:
                - string
                - 'null'
              description: 'The host of its database'
            databaseName:
              type:
                - string
                - 'null'
              description: 'The name of its database'
            databaseUser:
              type:
                - string
                - 'null'
              description: 'The user of its database'
            estateDatabaseName:
              type:
                - string
                - 'null'
              description: 'The database of its estates, when it has its own'
            estateName:
              type:
                - string
                - 'null'
              description: 'The name of its estate'
            estateOwner:
              type:
                - string
                - 'null'
              description: 'The owner of its estate'
            regionsDirectory:
              type:
                - string
                - 'null'
              description: 'The folder of its regions'
            core:
              type:
                - string
                - 'null'
              description: 'The OpenSimulator release it runs'
        links:
          type: object
          properties:
            self:
              type: string
    Services:
      type: object
      description: 'The services of the grids of this machine'
      required:
        - type
        - id
        - attributes
      properties:
        type:
          const: services
        id:
          type: string
        attributes:
          type: object
          properties:
            key:
              type: string
              description: 'What it is for: asset, inventory, profile, search...'
            name:
              type: string
              description: 'The name shown'
            slug:
              type: string
              description: 'Its grid, an underscore, its key'
            grid:
              type: string
              description: 'The nick of its grid'
            simulator:
              type:
                - string
                - 'null'
              description: 'The simulator that asks, when the service is shown as that simulator reaches it'
            uri:
              type:
                - string
                - 'null'
              description: 'Where it is reached'
            port:
              type: string
              description: 'private (the simulators), public (the viewers and other grids) or web (an address on a web site)'
            provider:
              type:
                - string
                - 'null'
              description: 'The instance that serves it, null when none of this machine does'
            served:
              type: boolean
              description: 'A Robust of the grid, or the simulator of a standalone, serves it'
            external:
              type: boolean
              description: 'Declared for the simulators, served somewhere else'
            connectors:
              type: array
              description: 'The connectors of Robust that serve it'
            section:
              type:
                - string
