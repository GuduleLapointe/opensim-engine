  /get_grid_info:
    get:
      operationId: getGridInfo
      tags:
        - 'Grid info'
      summary: 'Grid info'
      security: []
      description: 'Served by Robust at its public port, not by the engine, which reads it (`Grid::gridInfo()`). The elements are the keys of `[GridInfoService]` of Robust.ini, **every one**, the free ones included: `gridname`, `gridnick`, `login` (the address of the grid, which is the truth about it whatever address it was reached at), `economy`, `search`, `welcome`... What a grid says is kept for a day when it is verified.'
      servers:
        -
          url: '{login}'
          description: 'The login address of the grid'
          variables:
            login:
              default: 'http://grid.example.org:8002'
      responses:
        404:
          description: 'The address is not the login of a grid'
        200:
          description: 'The elements of `[GridInfoService]`'
          content:
            text/xml:
              schema:
                type: string
              examples:
                example:
                  value: |-
                    <?xml version="1.0"?>
                    <gridinfo><gridname>Demo World</gridname><gridnick>demo</gridnick><login>http://grid.example.org:8002/</login><economy>https://web.example.org/helpers</economy><search>https://web.example.org/search</search></gridinfo>
  /layout:
    get:
      operationId: getLayout
      tags:
        - System
      summary: 'System layout'
      description: 'The resolved `opensim.conf` layout, the configured SystemUser identity, and the current process identity. This operator endpoint is protected by the API key.'
      responses:
        200:
          description: 'The resolved layout and identities'
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      type: { const: layout }
                      id: { const: system }
                      attributes: { type: object, properties: { systemUser: { type: string }, systemUid: { type: integer }, systemGroup: { type: string }, systemGid: { type: integer }, currentUser: { type: string }, currentUid: { type: integer }, currentGroup: { type: string }, currentGid: { type: integer }, etcRoot: { type: string }, varRoot: { type: string }, logsRoot: { type: string } } }
  /setups/quick:
    post:
      operationId: quickSetup
      tags:
        - Setup
      summary: 'Quick setup'
      description: 'The setup that a few answers stand for. A grid has its Robust and a first simulator, `Welcome`, with its region; a standalone is one simulator that is the whole grid, with the name that was given. Everything the answers do not say is what the planners propose (ports, database, folders, options), so an empty request gives the proposals. `setup` is in the format of the setup files (`opensim import`), the password of the avatar is kept hashed in it. `problems` names the questions that are wrong or missing, `rows` lists every value the setup defines.'
      requestBody:
        required: false
        content:
          application/vnd.api+json:
            schema:
              type: object
              properties:
                data:
                  type: object
                  properties:
                    type:
                      const: setups
                    attributes:
                      type: object
                      properties: { type: { type: string, description: 'grid, standalone, simulator, or an implemented grid preset' }, name: { type: string, description: 'Of the grid, and of the simulator and its region for a standalone' }, private_port: { type: [integer, string], description: 'Private grid TCP port; empty keeps the planner proposal. For a simulator joining a grid, this is the remote grid service port.' }, grid_console_port: { type: [integer, string], description: 'Grid REST console TCP port; empty keeps the planner proposal.' }, http_port: { type: [integer, string], description: 'Simulator HTTP TCP port; its ten-port block also supplies default console and region ports.' }, console_port: { type: [integer, string], description: 'Simulator REST console TCP port; empty keeps the planner proposal.' }, region_port: { type: [integer, string], description: 'New region UDP port; empty keeps the planner proposal. An adopted region retains its original port.' }, existing_region: { type: string, description: 'Original Region.ini contents for a simulator joining a grid. Preserves the region UUID and settings; application stages a disabled simulator without creating accounts, a database or a placeholder region. Restore data and stop the source before enabling it.' }, login_uri: { type: string, description: 'http://login.example.org:8002' }, ssl: { type: boolean, default: false, description: 'Not implemented yet' }, hypergrid: { type: boolean, default: true }, search: { type: boolean, default: false, description: 'Cross-grid search: the shared provider (2do.directory) instead of the search of the grid. Not implemented yet' }, gloebit: { type: boolean, default: false, description: 'Gloebit as the currency instead of BetaGridLikeMoneyModule. Not implemented yet' }, ossl: { type: boolean, default: false, description: 'More OSSL functions for the parcel owners. Not implemented yet' }, avatar: { type: string, description: 'First Last: the avatar that owns the estate, made with the grid' }, password: { type: string }, email: { type: string } }
      responses:
        200:
          description: 'The setup, and what is wrong with the answers'
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      type: { const: setups }
                      id: { type: string }
                      attributes: { type: object, properties: { valid: { type: boolean, description: 'There is nothing wrong: the setup can be applied' }, capabilities: { type: array, items: { type: string, enum: [prepare, apply_prepared, existing_region] }, description: 'Supported setup operations. A planning request has no provisioning side effects, so clients can check support before applying a configuration.' }, problems: { type: object, description: 'What is wrong, by the name of the question', additionalProperties: { type: string } }, corrected: { type: object, description: 'The answers the setup rewrote (a name with accents, transliterated), by question: show them in the form, the person validates the change by sending it again', additionalProperties: { type: string } }, identity: { type: string, description: 'The grid nick, or the complete simulator instance name for a standalone or remote simulator' }, setup: { type: object, description: 'The grid, its simulator, its owner' }, rows: { type: array, description: 'Every value the setup defines, to show before it is applied: the section (grid, options, simulator, region, owner), the label and the value', items: { type: object, properties: { section: { type: string }, label: { type: string }, value: { type: string } } } }, types: { type: array, description: 'What can be set up, to offer as a choice: the name to send as `type`, the label, and whether the setup applies it yet', items: { type: object, properties: { name: { type: string }, label: { type: string }, implemented: { type: boolean } } } }, options: { type: array, description: 'The options of the form, in the order to show them: the name to send as an answer, the label, the default, the value taken, and whether the setup applies it yet. The helpers and what they serve are on in a quick setup', items: { type: object, properties: { name: { type: string }, label: { type: string }, default: { type: boolean }, value: { type: boolean }, implemented: { type: boolean } } } } } }
        400:
          description: 'The body is not a JSON document'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /setups/steps:
    post:
      operationId: setupStep
      tags:
        - Setup
      summary: 'Quick setup, one step'
      description: 'The scenario of the quick setup, for a client that only draws screens. It sends back the screen it was given, filled (`answers`), the button it pressed and the `state` it got, and receives the next screen, the same one with what is wrong (`notice`), or an action: `quit` with a message, `abort` with an error. With no `state` it receives the first screen. A `screen` has a `kind`: `menu` (`items` with `key`, `label`, `note`; the answer is `{name: key}`), `form` (`fields` with `name`, `label`, `value`, `secret`; the answer is a value for each), `checks` (`items` with `name`, `label`, `checked`, `note`; the answer is true or false for each) or `review` (`rows`, to confirm). The last confirmation makes the folders and writes the files of the grid and of its first simulator. `occupied_ports`, when supplied, is the fresh TCP/UDP port snapshot of the deployment host; it replaces the local machine port scan.'
      requestBody:
        required: false
        content:
          application/vnd.api+json:
            schema:
              type: object
              properties:
                data:
                  type: object
                  properties:
                    type:
                      const: steps
                    attributes:
                      type: object
                      properties: { state: { type: string, description: 'As the last reply gave it; empty for the first screen' }, button: { type: string, enum: [next, back, quit], default: next }, answers: { type: object, description: 'The screen, filled: a value for each of its fields, items or choice. For adoption, include existing_region INI contents with the type selection.' }, mode: { type: string, enum: [apply, prepare], default: apply, description: 'Prepare collects answers, including database settings, without provisioning. Send the mode on each step.' }, occupied_ports: { type: array, items: { type: integer, minimum: 1, maximum: 65535 }, description: 'Ports occupied on the selected deployment host; when present, local socket and config discovery is not used.' }, configuration: { type: object, description: 'A versioned configuration returned by prepare. With mode apply, validates and provisions it directly without asking further questions. Secrets belong in the request body.' } }
      responses:
        200:
          description: 'The next screen, or the action to do'
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      type: { const: steps }
                      id: { type: string }
                      attributes: { type: object, properties: { action: { type: string, enum: [screen, quit, abort, prepared] }, configuration: { type: object, description: 'Of prepared: instance identity, answers, setup preview and engine-generated TCP/UDP port bindings. Contains credentials; save privately and do not log it.' }, mode: { type: string, enum: [prepare], description: 'Returned on every prepare reply, confirming that no provisioning will run.' }, kind: { type: string, enum: [menu, form, checks, review], description: 'Of a screen' }, name: { type: string, description: 'Of a menu: the name of its answer' }, title: { type: string }, text: { type: string, description: 'Above the screen' }, notice: { type: string, description: 'What is wrong with the last answers, one line each: show it above the screen' }, items: { type: array, description: 'Of a menu or of check boxes', items: { type: object } }, fields: { type: array, description: 'Of a form: the name, the label, the value, secret (typed hidden) and readonly (only shown, not sent back)', items: { type: object } }, rows: { type: array, description: 'Of a review: the section, the label and the value', items: { type: object } }, value: { type: string, description: 'Of a menu: the key chosen so far' }, buttons: { type: object, description: 'The labels of next and back' }, wait: { type: string, description: 'What to say while the next step is done, when it takes time' }, state: { type: string, description: 'To send back with the answers' }, message: { type: string, description: 'Of quit: to tell, the setup is over' }, error: { type: string, description: 'Of abort: to tell, the setup is over' } } }
        400:
          description: 'The body is not a JSON document'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  securitySchemes:
    ApiKey:
      type: http
      scheme: bearer
      bearerFormat: osk_...
      description: 'A key made on the machine with `opensim api-key create`, sent as `Authorization: Bearer <key>`.'
  schemas:
    Problem:
      type: object
      description: 'RFC 9457 problem details'
      required:
        - title
        - status
      properties:
        type:
          type: string
          description: 'A URN that names the kind of problem'
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          description: 'The address that was asked'
    Grids:
      type: object
      description: 'The grids of this machine'
      required:
        - type
        - id
        - attributes
      properties:
        type:
          const: grids
        id:
          type: string
        attributes:
          type: object
          properties:
