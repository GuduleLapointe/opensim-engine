  '/grids/{grid}/addresses':
    get:
      operationId: getAddresses
      tags:
        - Addresses
      summary: Addresses
      description: "The addresses of the grid: the ones it gives its viewers and its simulators, each with where it comes from (`provider`: a Robust or a simulator that serves it, `simulator`, `live`: what the grid says at `get_grid_info`, `config`, `default`: the helpers' habit). `helpers` is where the helpers are, `economy` the address `currency.php` and `landtool.php` are under, `search` the web search, `searchApi` the one the simulators ask (`query`). These are links, not identities: the identity of the grid is its `uri`."
      parameters:
        -
          name: grid
          in: path
          required: true
          description: 'The nick of the grid'
          schema:
            type: string
      responses:
        200:
          description: 'The addresses'
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      type: { const: addresses }
                      id: { type: string }
                      attributes: { type: object, properties: { login: { type: [string, 'null'], description: 'The login address, as the grid says it' }, uri: { type: [string, 'null'], description: 'Its host and port' }, helpers: { type: [string, 'null'] }, economy: { type: [string, 'null'] }, search: { type: [string, 'null'] }, searchApi: { type: [string, 'null'] }, register: { type: [string, 'null'] }, offline: { type: [string, 'null'] }, addresses: { type: object, description: 'Every address, by the key of its service', additionalProperties: { type: string } }, sources: { type: object, description: 'Where each comes from', additionalProperties: { type: [string, 'null'] } } } }
        404:
          description: 'The grid is not known here'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security: []
  '/grids/{grid}/info':
    get:
      operationId: getInfo
      tags:
        - Addresses
      summary: 'What the grid says'
      description: '**Every** element the grid gave at its `get_grid_info`, the free ones included (what is not standard is passed on), as it said them when it was last verified; `live` is false when the grid was not verified and the elements are what its config says. Nothing is asked here: a verification is joining a grid, starting it, or `Grid::refreshInfo()`.'
      parameters:
        -
          name: grid
          in: path
          required: true
          description: 'The nick of the grid'
          schema:
            type: string
      responses:
        200:
          description: 'The elements of the grid'
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      type: { const: info }
                      id: { type: string }
                      attributes: { type: object, properties: { live: { type: boolean }, login: { type: [string, 'null'] }, uri: { type: [string, 'null'] }, elements: { type: object, additionalProperties: { type: string } } } }
        404:
          description: 'The grid is not known here'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security: []
  '/grids/{grid}/monitor':
    get:
      operationId: getMonitor
      tags:
        - Monitor
      summary: 'Status of the grid'
      description: 'The state of the grid at a glance. `level` is `ok`, `degraded` (a simulator is down, a region is offline), `down` (its Robust does not run) or `unknown`. The instances are the ones of this machine, with what they use; the simulators add the ones that run elsewhere, which the regions of the grid tell about. `format=text` gives the lines of `opensim status`, `format=png` a picture of them (a square, the text colored by the level) to put on a prim; it takes the same `/text-images` fonts and colors.'
      parameters:
        -
          name: grid
          in: path
          required: true
          description: 'The nick of the grid'
          schema:
            type: string
        -
          name: format
          in: query
          required: false
          description: 'The form of the answer'
          schema:
            type: string
            enum:
              - json
              - text
              - png
            default: json
        -
          name: size
          in: query
          required: false
          description: 'png: the size of the font, from the width of the lines by default'
          schema:
            type: integer
            minimum: 1
            maximum: 1000
        -
          name: color
          in: query
          required: false
          description: 'png: the color of the text, from the level by default'
          schema:
            type: string
        -
          name: background
          in: query
          required: false
          description: 'png: the color of the background'
          schema:
            type: string
            default: black
      responses:
        200:
          description: 'The status'
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      type: { const: monitor }
                      id: { type: string }
                      attributes: { type: object, properties: { grid: { type: string }, name: { type: string }, level: { type: string, enum: [ok, degraded, down, unknown] }, login: { type: [string, 'null'] }, instances: { type: array, items: { type: object }, description: 'name, type (robust or simulator), running, pid, cpu, memory, rss' }, simulators: { type: array, items: { type: object }, description: 'name, uri, local, running, regions, online' }, regions: { type: object, description: 'total and online' }, users: { type: [object, 'null'], description: 'The numbers of the grid (members, in world...)' }, up: { type: integer }, down: { type: integer }, summary: { type: string } } }
            text/plain:
              schema:
                type: string
              examples:
                status:
                  value: |
                    OK - Demo World
                    NAME        TYPE       STATE  REGIONS  %CPU  %MEM
                    demo        robust     up     -        0.3   1.2
                    demo.alpha  simulator  up     3/3      2.1   6.4
                    2 up - regions 3/3 - in world 4 - cpu 2.4% - mem 7.6% - rss 812345
            image/png:
              schema:
                type: string
                format: binary
        404:
          description: 'The grid is not known here'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        503:
          description: 'The machine cannot draw: php-imagick is missing (png)'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security: []
  '/grids/{grid}/health':
    get:
      operationId: getHealth
      tags:
        - Health
      summary: 'Health of the grid'
      description: 'The addresses the config of the grid gives (the services of Robust, the web services, the pages), what the grid says of itself at `get_grid_info`, and the ones that are expected and not given, asked now: a service that must refuse a call without data refuses it, and answers one that makes sense. The PHP extensions the engine needs and the files it reads come with them. `level` is `error` when something does not answer as it should, `ok` when all that is asked does, `none` when there is nothing to ask. The groups are the sections of the files of the grid; each row has the address, the status (the HTTP code, or the error), the time in milliseconds and its own level.'
      parameters:
        -
          name: grid
          in: path
          required: true
          description: 'The nick of the grid'
          schema:
            type: string
      responses:
        200:
          description: 'The health of the grid'
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      type: { const: health }
                      id: { type: string }
                      attributes: { type: object, properties: { level: { type: string, enum: [ok, error, none] }, groups: { type: array, items: { type: object, properties: { file: { type: string, description: 'The file the section is in' }, title: { type: string, description: 'The section' }, rows: { type: array, items: { type: object } } } } } } }
        404:
          description: 'The grid is not known here'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  '/grids/{grid}/search/register':
    get:
      operationId: registerSimulator
      tags:
        - Search
      summary: 'Register a simulator'
      description: 'What the module of search of a simulator calls (`DATA_SRV_<grid>` of `[DataSnapshot]` is the address): a GET with the host and the port **of the simulator**, not those of the grid. The answer is nothing: the simulator waits for it to go on starting. The helpers read its snapshot once the answer is sent, after a pause for its regions to load, and again soon after; one that does not answer is read less and less often, then forgotten. `offline` forgets it and what it told.'
      parameters:
        -
          name: grid
          in: path
          required: true
          description: 'The nick of the grid'
          schema:
            type: string
        -
          name: host
          in: query
          required: true
          description: "The host of the simulator (not the grid's)"
          schema:
            type: string
            example: sim.example.org
        -
          name: port
          in: query
          required: true
          description: "The HTTP port of the simulator (not the grid's)"
          schema:
            type: integer
            example: 9000
        -
          name: service
          in: query
          required: true
          description: '`online` when the simulator starts, `offline` when it stops'
          schema:
            type: string
            example: online
      responses:
        200:
          description: 'Registered (or unregistered); nothing is said'
        400:
          description: 'The host, the port or the service is missing or wrong'
          content:
            text/plain:
              schema:
                type: string
        404:
          description: 'The grid is not known here'
          content:
            text/plain:
              schema:
                type: string
        503:
          description: 'The grid has no search database, or it cannot be reached'
          content:
            text/plain:
              schema:
                type: string
      security: []
  '/grids/{grid}/search/query':
    post:
      operationId: searchQuery
      tags:
        - Search
      summary: 'Search questions'
      description: |
        The questions of the viewers and of the simulators to the search. XML-RPC, as the module OpenSimSearch speaks it: the body is a method call with one struct, the answer a struct with `success`, `errorMessage` and the rows in `data` (nothing in `data` when there is no result or it failed). The grid has the status of a failure only when the request is not understood or the search is not there.

        ### `dir_places_query`

        The places (parcels shown in search) whose name or description has the words.

        **Request** (the struct)

        | Field | Type | |
        | --- | --- | --- |
        | `text` | string | The words, separated by spaces |
        | `flags` | integer | The rating the viewer wants: bits 24 (PG), 25 (Mature), 26 (Adult); bit 10 asks the order by traffic |
        | `category` | integer | The category of the places, 0 for any |
        | `query_start` | integer | The row to start from, 101 are given at most |

        **Answer** (each row of `data`)

        | Field | Type | |
        | --- | --- | --- |
        | `parcel_id` | string | The identifier the viewer shows the place by |
        | `name` | string | The name of the parcel |
        | `for_sale` | string | Always False: the land for sale is another question |
        | `auction` | string | Always False |
        | `dwell` | number | Its traffic |
        | `regionname` | string | The region it is in; the other columns of the parcel and of its region come with it |

        ### `dir_popular_query`

        The popular places, by traffic.

        **Request** (the struct)

        | Field | Type | |
        | --- | --- | --- |
        | `text` | string | Words of the name, empty for all |
        | `flags` | integer | Bit 12 asks the places that have a picture; bits 24 to 26 the rating |
        | `query_start` | integer | The row to start from, 100 are given at most |
        | `include_hypergrid` | string | `false` keeps the places of the other grids out |
        | `include_landsales` | string | `true` adds the land for sale |
        | `gatekeeper_url` | string | The grid the search is made for, when the address does not say it (`gk`) |

        **Answer** (each row of `data`)

        | Field | Type | |
        | --- | --- | --- |
        | `parcel_id` | string | The identifier of the place |
        | `name` | string | The name |
        | `dwell` | number | Its traffic |
        | `gatekeeperURL` | string | The grid it belongs to |
        | `regionname` | string | The region it is in |
        | `regionUUID` | string | The UUID of the region |
        | `landingpoint` | string | Where an avatar lands |
        | `imageUUID` | string | Its picture |

        ### `dir_land_query`

        The land for sale.

        **Request** (the struct)

        | Field | Type | |
        | --- | --- | --- |
        | `flags` | integer | Bits 24 to 26 the rating; 20 asks a price limit, 21 an area limit; the order is bit 15 (ascending), 16 (price), 18 (area), 19 (name), by price per meter by default |
        | `type` | integer | The kind of land: 4294967295 for any, bits 3 and 4 for the mainland or an estate, auctions are not listed |
        | `price` | integer | The highest price, when flags asks it |
        | `area` | integer | The smallest area, when flags asks it |
        | `query_start` | integer | The row to start from, 101 are given at most |

        **Answer** (each row of `data`)

        | Field | Type | |
        | --- | --- | --- |
        | `parcel_id` | string | The identifier of the parcel |
        | `name` | string | Its name |
        | `auction` | string | Always false |
        | `for_sale` | string | Always true |
        | `sale_price` | integer | Its price |
        | `landing_point` | string | Where an avatar lands |
        | `region_UUID` | string | The region it is in |
        | `area` | integer | Its area in square meters |

        ### `dir_events_query`

        The events of a day, or the ones to come.

        **Request** (the struct)

        | Field | Type | |
        | --- | --- | --- |
        | `text` | string | `day\|category\|words`: the day is a number of days from today, or `u` for the events to come and in progress; the category 0 for any |
        | `flags` | integer | Bits 24 to 26: the rating |
        | `query_start` | integer | The row to start from, 101 are given at most |

        **Answer** (each row of `data`)

        | Field | Type | |
        | --- | --- | --- |
        | `owner_id` | string | Who organizes it |
        | `name` | string | Its title |
        | `event_id` | integer | Its identifier |
        | `date` | string | When it starts, in Pacific time (`m/d h:i A`), as the viewers show it |
        | `unix_time` | integer | When it starts, Unix time |
        | `event_flags` | integer | The rating: 0 PG, 1 Mature, 2 Adult |
        | `landing_point` | string | Where it is on the map of the world (`x,y,z`) |

        ### `dir_classified_query`

        The classifieds of the profiles, by price of the listing.

        **Request** (the struct)

        | Field | Type | |
        | --- | --- | --- |
        | `text` | string | Words of the name or of the description |
        | `flags` | integer | Bits 2 (PG), 3 (Mature), 6 (Adult) |
        | `category` | integer | The category, 0 for any |
        | `query_start` | integer | The row to start from, 101 are given at most |

        **Answer** (each row of `data`)

        | Field | Type | |
        | --- | --- | --- |
        | `classifiedid` | string | The UUID of the classified |
        | `name` | string | Its title |
        | `classifiedflags` | integer | Its flags |
        | `creation_date` | integer | Unix time |
        | `expiration_date` | integer | Unix time |
        | `priceforlisting` | integer | What the listing costs |

        ### `event_info_query`

        One event, with all it says.

        **Request** (the struct)

        | Field | Type | |
        | --- | --- | --- |
        | `eventID` | integer | The identifier of the event |

        **Answer** (each row of `data`)

        | Field | Type | |
        | --- | --- | --- |
        | `event_id` | integer | Its identifier |
        | `creator` | string | Who made it |
        | `name` | string | Its title |
        | `category` | string | Its category by name (Discussion, Sports, Live Music, Commercial, Nightlife/Entertainment, Games/Contests, Pageants, Education, Arts and Culture, Charity/Support Groups, Miscellaneous) |
        | `description` | string | What it is |
        | `date` | string | When it starts, server time |
        | `dateUTC` | integer | When it starts, Unix time |
        | `duration` | integer | Minutes |
        | `covercharge` | integer | Whether there is a cover charge |
        | `coveramount` | integer | How much |
        | `simname` | string | Where it is, as a link; without the grid when it is the grid that asks (`gk`) |
        | `globalposition` | string | Where on the map of the world |
        | `eventflags` | integer | The rating |

        ### `classifieds_info_query`

        One classified, with all it says.

        **Request** (the struct)

        | Field | Type | |
        | --- | --- | --- |
        | `classifiedID` | string | The UUID of the classified |

        **Answer** (each row of `data`)

        | Field | Type | |
        | --- | --- | --- |
        | `classifieduuid` | string | Its UUID |
        | `creatoruuid` | string | Who made it |
        | `creationdate` | integer | Unix time |
        | `expirationdate` | integer | Unix time |
        | `category` | string | Its category |
        | `name` | string | Its title |
        | `description` | string | What it is |
        | `parceluuid` | string | The parcel it points to |
        | `parentestate` | integer | The estate |
        | `snapshotuuid` | string | Its picture |
        | `simname` | string | The region |
        | `posglobal` | string | Where |
        | `parcelname` | string | The parcel |
        | `classifiedflags` | integer | Its flags |
        | `priceforlisting` | integer | What the listing costs |

        ### `avatar_publish_update`

        The "show in search" box of a profile, which OpenSimulator ignores and the module tells here with the secure session of the avatar.

        **Request** (the struct)

        | Field | Type | |
        | --- | --- | --- |
        | `avatar_id` | string | The UUID of the avatar |
        | `secure_session_id` | string | Its secure session, which only the simulator it is connected to holds |
        | `allow_publish` | string | `true` to show the profile in search |

        **Answer**: `success`, with the reason in `errorMessage` when it failed.
      parameters:
        -
          name: grid
          in: path
          required: true
          description: 'The nick of the grid'
          schema:
            type: string
        -
          name: gk
          in: query
          required: false
          description: 'The gatekeeper of the grid the search is made for (`grid.example.org:8002`), when the search is shared: only its places are answered'
          schema:
            type: string
      requestBody:
        required: true
        content:
          text/xml:
            schema:
              type: string
              description: 'XML-RPC method call'
            examples:
              dir_places_query:
                summary: dir_places_query
                value: |-
                  <?xml version="1.0"?>
                  <methodCall>
                  <methodName>dir_places_query</methodName>
                  <params>
                  <param>
                  <value><struct>
