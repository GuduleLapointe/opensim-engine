      security: []
  '/grids/{grid}/offline-messages/SaveMessage':
    post:
      operationId: offlineSaveMessage
      tags:
        - 'Offline messages'
      summary: 'Save a message'
      description: |-
        A message for an avatar who is not there is kept. What the module V1 of the simulators posts to `<OfflineMessageURL>/SaveMessage/` (the last slash is theirs, it is accepted with or without).

        **Request**: The `GridInstantMessage` of OpenSimulator, in XML (`fromAgentID`, `fromAgentName`, `toAgentID`, `dialog`, `message`, ...).

        **Answer**: `<boolean>true</boolean>` when it was kept, `<error>` when it was not.
      parameters:
        -
          name: grid
          in: path
          required: true
          description: 'The nick of the grid'
          schema:
            type: string
      requestBody:
        required: true
        content:
          text/xml:
            schema:
              type: string
              description: XML
            examples:
              example:
                value: |-
                  <?xml version="1.0" encoding="utf-8"?>
                  <GridInstantMessage xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xmlns:xsd="http://www.w3.org/2001/XMLSchema"><fromAgentID>bbbbbbbb-2222-4222-8222-bbbbbbbbbbbb</fromAgentID><fromAgentName>Ada Love</fromAgentName><toAgentID>aaaaaaaa-1111-4111-8111-aaaaaaaaaaaa</toAgentID><dialog>0</dialog><fromGroup>false</fromGroup><message>Hello</message></GridInstantMessage>
      responses:
        200:
          description: '`<boolean>true</boolean>` when it was kept, `<error>` when it was not'
          content:
            text/xml:
              schema:
                type: string
        400:
          description: 'The body is empty, or is not XML'
          content:
            text/xml:
              schema:
                type: string
        404:
          description: 'The grid is not known here, or the method is not one of the module'
          content:
            text/xml:
              schema:
                type: string
        503:
          description: 'The grid has no database for the offline messages, or it cannot be reached'
          content:
            text/xml:
              schema:
                type: string
      security: []
  '/grids/{grid}/offline-messages/RetrieveMessages':
    post:
      operationId: offlineRetrieveMessages
      tags:
        - 'Offline messages'
      summary: 'Retrieve messages'
      description: |-
        The messages kept for an avatar who comes back are given, and forgotten. What the module V1 of the simulators posts to `<OfflineMessageURL>/RetrieveMessages/` (the last slash is theirs, it is accepted with or without).

        **Request**: The UUID of the avatar: `<UUID><Guid>...</Guid></UUID>`.

        **Answer**: An `ArrayOfGridInstantMessage` with the messages, in the XML they were kept in.
      parameters:
        -
          name: grid
          in: path
          required: true
          description: 'The nick of the grid'
          schema:
            type: string
      requestBody:
        required: true
        content:
          text/xml:
            schema:
              type: string
              description: XML
            examples:
              example:
                value: '<UUID><Guid>aaaaaaaa-1111-4111-8111-aaaaaaaaaaaa</Guid></UUID>'
      responses:
        200:
          description: 'An `ArrayOfGridInstantMessage` with the messages, in the XML they were kept in'
          content:
            text/xml:
              schema:
                type: string
        400:
          description: 'The body is empty, or is not XML'
          content:
            text/xml:
              schema:
                type: string
        404:
          description: 'The grid is not known here, or the method is not one of the module'
          content:
            text/xml:
              schema:
                type: string
        503:
          description: 'The grid has no database for the offline messages, or it cannot be reached'
          content:
            text/xml:
              schema:
                type: string
      security: []
