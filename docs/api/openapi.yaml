      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              type: object
              properties:
                data:
                  type: object
                  properties:
                    attributes:
                      type: object
                      properties: { enabled: { type: boolean, description: 'Enable or disable the simulator; a running simulator is not stopped' } }
      responses:
        200:
          description: Changed
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Simulators'
        400:
          description: 'A value is wrong'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        404:
          description: 'There is none with this id'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        503:
          description: 'No channel can change it now'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /services:
    get:
      operationId: listServices
      tags:
        - 'The machine: services'
      summary: 'The services of the grids of this machine, searched, filtered, sorted and paged'
      parameters:
