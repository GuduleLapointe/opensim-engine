            schema:
              type: object
              properties:
                data:
                  type: object
                  properties:
                    attributes:
                      type: object
                      properties: { email: { type: string }, title: { type: string }, level: { type: integer }, active: { type: boolean }, password: { type: string, description: 'A new password' }, home: { type: string, description: 'The UUID of the home region' }, about: { type: string, description: 'Of the profile the avatar has' }, profileUrl: { type: string }, wants: { type: string }, skills: { type: string }, languages: { type: string }, firstLife: { type: string } }
      responses:
