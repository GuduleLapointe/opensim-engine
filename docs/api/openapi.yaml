          name: search
          in: query
          schema:
            type: string
        -
          name: sort
          in: query
          description: 'A column, `-` before it for the descending order'
          schema:
            type: string
        -
          name: 'page[number]'
          in: query
          schema:
            type: integer
            minimum: 1
        -
          name: 'page[size]'
          in: query
          schema:
            type: integer
            minimum: 0
        -
          name: 'filter[served]'
          in: query
          schema:
            type: string
            enum:
              - 'yes'
              - 'no'
        -
          name: 'filter[port]'
          in: query
          schema:
            type: string
            enum:
              - private
              - public
              - web
      responses:
        200:
          description: 'A page of the services'
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Services'
                  meta:
                    type: object
        404:
          description: 'The grid is not known here'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        503:
          description: 'What the list is read from is not available'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  '/services/{id}':
    get:
      operationId: getService
      tags:
        - 'The machine: services'
      summary: 'One of the services by its id'
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
