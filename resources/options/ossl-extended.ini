;; target: config-include/osslEnable.ini
;; More OSSL functions: the owners of parcels, and the members of the groups that own them, can run the functions the core
;; reserves to the estate (NPC, animations, drawing on textures...). Combined into the osslEnable.ini of the grid.
[OSSL]
    osslParcelO = "PARCEL_OWNER,"
    osslParcelOG = "PARCEL_GROUP_MEMBER,PARCEL_OWNER,"
