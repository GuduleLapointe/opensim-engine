;; OpenSimKitDefaults.ini: what the toolset changes in the defaults of OpenSimulator (OpenSimDefaults.ini).
;;
;; Nothing is written in the core: every folder OpenSimulator would use by default, relative to the core, is given here, relative to
;; the folders of the simulator (DataDirectory, CacheDirectory), which the config of each simulator gives. Laid over the defaults
;; of the core in OpenSimGridDefaults.ini, the master of the simulators of a grid.

[Startup]
RegistryLocation = "${Const|DataDirectory}/registry"
crash_dir = "${Const|CacheDirectory}/crashes"
DecodedSculptMapPath = "${Const|CacheDirectory}/j2kDecodeCache"

[DatabaseService]
StorageProvider = "OpenSim.Data.MySQL.dll"

[GridService]
MapTileDirectory = "${Const|CacheDirectory}/maptiles"

[DataSnapshot]
snapshot_cache_directory = "${Const|CacheDirectory}/DataSnapshot"

[YEngine]
ScriptEnginesPath = "${Const|DataDirectory}/ScriptEngines"
