[Option]
Label = "Offline messages: the helpers (module V1)"
Description = "The messages for the avatars who are not there are kept by the helpers (module V1: mailed on request, no limit), not by Robust (module V2)"
Offer = false
Default = true
Answer = offline
Group = offline
Requires = service:offline
Needs = "the grid {nick} has no helpers: the module V1 keeps its messages with them, opensim enable {nick} offline-robust uses the service of Robust"
