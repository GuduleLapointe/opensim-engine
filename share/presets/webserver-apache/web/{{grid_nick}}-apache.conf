# Helpers of the grid {{grid_nick}}. It only takes the paths of the helpers. In the virtual host of the grid, add:
#     Include {{grid_dir}}/web/{{grid_nick}}-apache.conf
# PHP is what handles .php on your Apache, mod_php or PHP-FPM.
<Directory {{docroot}}>
	Require all granted
	SetEnv OPENSIM_GRID {{grid_nick}}
</Directory>
AliasMatch "^/(?:{{web_regex}})(?:/.*)?$" "{{docroot}}/index.php"
