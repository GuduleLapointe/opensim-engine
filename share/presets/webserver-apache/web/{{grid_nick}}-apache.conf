# Site of the grid {{grid_nick}}, written by `opensim web {{grid_nick}} snippet apache`.
# A complete virtual host: put it in /etc/apache2/sites-available/ (a2ensite) or include it.
# PHP is what handles .php on your Apache, mod_php or PHP-FPM.
# For https, add the certificate as usual (certbot --apache).
# What is not a file of the root goes to its index.php, the router of the helpers.

<VirtualHost *:{{listen_port}}>
	ServerName {{web_host}}
	DocumentRoot {{docroot}}
	<Directory {{docroot}}>
		Options -Indexes
		Require all granted
		DirectoryIndex index.php index.html
		FallbackResource /index.php
		SetEnv OPENSIM_GRID {{grid_nick}}
	</Directory>
</VirtualHost>
