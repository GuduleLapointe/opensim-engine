# Helpers of the grid {{grid_nick}}.
#
# Add this line in {{web_url}} virtual host:
#
#     Include {{grid_dir}}/web/{{grid_nick}}-apache.conf
#
# Either Apache mod_php or PHP-FPM must be enabled.

# You may adjust AliasMatch to the paths that must be handled by the helpers.
AliasMatch "^/(?:{{web_regex}})(?:/.*)?$" "{{docroot}}/index.php"

<Directory {{docroot}}>
	Require all granted
	SetEnv OPENSIM_GRID {{grid_nick}}
</Directory>
