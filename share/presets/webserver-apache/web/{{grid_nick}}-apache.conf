# Helpers of the grid {{grid_nick}}: include this file in the virtual host of the grid. It only takes the paths of the helpers.
# PHP is what handles .php on your Apache, mod_php or PHP-FPM.
<Directory {{docroot}}>
	Require all granted
	SetEnv OPENSIM_GRID {{grid_nick}}
</Directory>
AliasMatch "^/(?:{{web_regex}})(?:/.*)?$" "{{docroot}}/index.php"
