[Const]
    BaseHostname = "{{base_hostname}}"
    BaseURL = "http://{{base_hostname}}"
    WebURL = "{{web_url}}"
    PublicPort = {{public_port}}
    PrivatePort = {{private_port}}
    EtcDirectory = "{{etc_directory}}"
    DataDirectory = "{{data_directory}}"
    CacheDirectory = "{{cache_directory}}"
    LogsDirectory = "{{logs_directory}}"

[Startup]
    PIDFile = "${Const|CacheDirectory}/{{grid_nick}}.pid"
    RegistryLocation = "${Const|DataDirectory}/registry"
    ConfigDirectory = "${Const|EtcDirectory}/robust-include"
    ConsoleHistoryFile = "${Const|LogsDirectory}/{{grid_nick}}.RobustConsoleHistory.txt"

[DatabaseService]
    ConnectionString = "{{connection_string}}"

[AssetService]
    BaseDirectory = "${Const|DataDirectory}/fsassets/data"
    SpoolDirectory = "${Const|CacheDirectory}/fsassets/tmp"
    AssetLoaderArgs = "${Const|DataDirectory}/assets/AssetSets.xml"

[GridService]
    MapTileDirectory = "${Const|CacheDirectory}/maptiles"

[LibraryService]
    DefaultLibrary = "${Const|DataDirectory}/inventory/Libraries.xml"

[MapImageService]
    TilesStoragePath = "${Const|DataDirectory}/maptiles"

;; The remote console, every right on Robust through its port
;; @if console_rest
[Network]
    ConsoleHost = "{{console_host}}"
    ConsoleUser = "{{console_user}}"
    ConsolePass = "{{console_pass}}"
    ConsolePort = {{console_port}}
;; @end
