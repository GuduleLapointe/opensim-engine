;; The module of search of the simulators asks the helpers for the places, the land for sale...
[Search]
    Module = OpenSimSearch
    SearchURL = "{{url_query}}"

;; ... and the simulators tell their regions to the helpers
[DataSnapshot]
    index_sims = true
    gridname = "{{grid_name}}"
    DATA_SRV_{{data_service}} = "{{url_register}}"
