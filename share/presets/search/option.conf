[Option]
Label = "Search module (OpenSimSearch)"
Description = "The places, events and land for sale of the grid are searched through its helpers, and found by the grids that share their search"
Offer = false
Default = true
Answer = search
Requires = service:query, service:register
Modules = opensimsearch
Initial = GridInfoService/search, LoginService/SearchURL
Keep = DataSnapshot/index_sims, DataSnapshot/gridname
Needs = "the grid {nick} has no helpers: give the address of its search service, opensim enable {nick} search https://www.example.org/helpers"
