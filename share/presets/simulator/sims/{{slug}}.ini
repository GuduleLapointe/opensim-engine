;; Generated by opensim setup: simulator {{simulator_name}} of the grid {{grid_name}}

[Const]
;; @if !master
BinDirectory = "{{bin_dir}}"
BaseHostname = "{{base_hostname}}"
BaseURL = "http://{{base_hostname}}"
PublicPort = {{public_port}}
PrivatePort = {{private_port}}
PrivURL = "${Const|BaseURL}"
EtcDirectory = "{{grid_dir}}"
;; @end
DataDirectory = "{{data_directory}}"
CacheDirectory = "{{cache_directory}}"
LogsDirectory = "{{logs_directory}}"

[Startup]
regionload_regionsdir = "{{regions_dir}}"
;; @if !master
RegistryLocation = "${Const|DataDirectory}/registry"
;; @end
PIDFile = "${Const|CacheDirectory}/{{slug}}.pid"
ConsoleHistoryFile = "${Const|LogsDirectory}/{{slug}}.OpenSimConsoleHistory.txt"
;; @if !master
crash_dir = "${Const|CacheDirectory}/crashes"
DecodedSculptMapPath = "${Const|CacheDirectory}/j2kDecodeCache"
;; @end

[Network]
http_listener_port = {{http_port}}
;; @if console_rest
;; Remote (REST) console of the simulator: every right on it, from the
;; machine that has the port, in the block of ten ports of the simulator
ConsoleHost = "{{console_host}}"
ConsoleUser = "{{console_user}}"
ConsolePass = "{{console_pass}}"
console_port = {{console_port}}
;; @end
;; @if console_screen
;; Remote (REST) console of the simulator: not enabled, its port is kept here,
;; in the block of ten ports of the simulator (ConsoleUser, ConsolePass, console_port)
;console_port = {{console_port}}
;; @end
ExternalHostNameForLSL = "{{lsl_host}}"

[DatabaseService]
;; @if !master
StorageProvider = "OpenSim.Data.MySQL.dll"
;; @end
ConnectionString = "{{connection_string}}"

;; @if !master
[GridService]
MapTileDirectory = "${Const|CacheDirectory}/maptiles"

[DataSnapshot]
snapshot_cache_directory = "${Const|CacheDirectory}/DataSnapshot"

[YEngine]
ScriptEnginesPath = "${Const|DataDirectory}/ScriptEngines"

;; OSSL is part of the standard config, as the grid sets it (its osslEnable.ini)
[OSSL]
Include-osslDefaultEnable = "{{config_dir}}/config-include/osslDefaultEnable.ini"

;; @end
[Estates]
DefaultEstateName = "{{estate_name}}"
DefaultEstateOwnerName = "{{estate_owner}}"
;; @if standalone_owner
DefaultEstateOwnerUUID = "{{owner_uuid}}"
DefaultEstateOwnerEMail = "{{owner_email}}"
DefaultEstateOwnerPassword = "{{owner_password}}"
;; @end
;; @if !master

[Architecture]
Include-Architecture = "{{architecture_file}}"
;; @end
