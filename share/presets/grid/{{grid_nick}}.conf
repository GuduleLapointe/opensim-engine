[Grid]
Runtime = {{runtime}}
GridName = {{grid_name}}
GridNick = {{grid_nick}}
slug = {{grid_slug}}
OpensimVersion = {{opensim_version}}
CoreDirectory = {{core_directory}}
EtcDirectory = "{{etc_directory}}"
DataDirectory = "{{data_directory}}"
CacheDirectory = "{{cache_directory}}"
LogsDirectory = "{{logs_directory}}"
RegionSpacing = {{region_spacing}}
Center = {{center}}
OfflineMessages = {{offline}}
Options = {{options}}
;; @if standalone
;; A standalone: its simulator serves the grid itself, its address and its database are its own
Standalone = true
Hypergrid = {{enable_hypergrid}}
BaseHostname = {{base_hostname}}
WebUrl = {{web_url}}
PublicPort = {{public_port}}
DatabaseHost = {{db_host}}
DatabaseName = {{db_name}}
DatabaseUser = {{db_user}}
DatabasePassword = {{db_pass}}
;; @end
