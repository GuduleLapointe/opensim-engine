[Option]
Label = "Economy: Gloebit"
Description = "Real money through Gloebit: the keys of your Gloebit application are yours to give"
Offer = true
Default = false
Group = economy
Uses = helpers
Modules = gloebit
Asks = Gloebit/GLBKey, Gloebit/GLBSecret, Gloebit/GLBOwnerName
Note = "the keys of your Gloebit application are yours to give: {keys} in [Gloebit] of the OpenSim.ini of the grid or of the simulators (Gloebit.ini.example), the module does nothing without them"
Initial = Gloebit/GLBEnvironment
