# Helpers of the grid {{grid_nick}}. It only takes the paths of the helpers. In the server block of the grid, add:
#     include {{grid_dir}}/web/{{grid_nick}}-nginx.conf;
location ~ ^/({{web_regex}})(/|$) {
	include fastcgi_params;
	fastcgi_param SCRIPT_FILENAME {{docroot}}/index.php;
	fastcgi_param OPENSIM_GRID {{grid_nick}};
	fastcgi_pass unix:{{php_socket}};
}
