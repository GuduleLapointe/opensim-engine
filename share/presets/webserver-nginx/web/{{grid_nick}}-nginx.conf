# Helpers of the grid {{grid_nick}}.
#
# It only takes the paths of the helpers.
#
# Add this line in Nginx {{web_url}} site block:
#     include {{grid_dir}}/web/{{grid_nick}}-nginx.conf;

# You may adjust location regex to the paths that must be handled by the helpers.
location ~ ^/({{web_regex}})(/|$) {
	include fastcgi_params;
	fastcgi_param SCRIPT_FILENAME {{docroot}}/index.php;
	fastcgi_param OPENSIM_GRID {{grid_nick}};
	fastcgi_pass unix:{{php_socket}};
}
