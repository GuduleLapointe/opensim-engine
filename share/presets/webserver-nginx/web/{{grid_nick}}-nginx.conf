# Helpers of the grid {{grid_nick}}: include this file in the server block of the grid. It only takes the paths of the helpers.
location ~ ^/({{web_regex}})(/|$) {
	include fastcgi_params;
	fastcgi_param SCRIPT_FILENAME {{docroot}}/index.php;
	fastcgi_param OPENSIM_GRID {{grid_nick}};
	fastcgi_pass unix:{{php_socket}};
}
