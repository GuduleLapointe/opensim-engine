# Site of the grid {{grid_nick}}, written by `opensim web {{grid_nick}} snippet nginx`.
# A complete server: put it in /etc/nginx/conf.d/ or include it in the http block.
# For https, add the certificate as usual (certbot --nginx).
# What is not a file of the root goes to its index.php, the router of the helpers.

server {
	listen {{listen_port}};
	listen [::]:{{listen_port}};
	server_name {{web_host}};
	root {{docroot}};
	index index.php index.html;

	location / {
		try_files $uri $uri/ /index.php?$query_string;
	}

	location ~ \.php$ {
		# A script that is not a file of the root is the business of the router
		try_files $uri /index.php?$query_string;
		include fastcgi_params;
		fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
		fastcgi_param OPENSIM_GRID {{grid_nick}};
		fastcgi_pass unix:{{php_socket}};
	}
}
